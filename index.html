<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wordly - Dictionary</title>

  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>

<body>

  <header>
    <h1>📖 Wordly</h1>
    <p>Your simple online dictionary</p>
  </header>

  <main>

    <section class="search-section">
      <form id="searchForm">
        <label for="wordInput">Search for a word</label>

        <div class="search-box">
          <input
            type="text"
            id="wordInput"
            placeholder="Enter a word..."
            autocomplete="off"
          >

          <button type="submit" id="searchButton">
            Search
          </button>
        </div>
      </form>
    </section>

    <section id="message" class="message"></section>

    <section id="wordResult" class="word-result">

      <div class="word-header">
        <div>
          <h2 id="word"></h2>
          <p id="phonetic"></p>
        </div>

        <button id="audioButton" class="audio-button" hidden>
          🔊
        </button>
      </div>

      <div id="meanings"></div>

    </section>

  </main>

  <footer>
    <p>Wordly Dictionary App</p>
  </footer>

</body>
</html>
